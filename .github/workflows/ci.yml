name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, test
        shell: pwsh
        run: |
          cargo xtask ci 2>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content ci.log -Tail 200 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            # Annotations are the only failure output readable without the raw
            # job log (REST API), and they show up inline on the pull request.
            Select-String -Path ci.log -Pattern 'error(\[E\d+\])?:|panicked at|^---- |^test result: FAILED|xtask failed' |
              Select-Object -First 10 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: docs links
        run: cargo xtask docs-check
      - name: version sync
        run: cargo xtask version-sync

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run end-to-end scenarios
        run: cargo run -p delta-update-e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
