name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt, clippy, test
        shell: pwsh
        run: |
          cargo xtask ci 2>&1 | Tee-Object -FilePath ci.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content ci.log -Tail 200 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            # Annotations are the only failure output readable without the raw
            # job log (REST API), and they show up inline on the pull request.
            Select-String -Path ci.log -Pattern 'error(\[E\d+\])?:|panicked at|^---- |^test result: FAILED|xtask failed' |
              Select-Object -First 10 |
              ForEach-Object { Write-Output "::error::$($_.Line)" }
            exit 1
          }
      - name: docs links
        run: cargo xtask docs-check
      - name: version sync
        run: cargo xtask version-sync
      - name: pinned trust root contract
        # The feature is opt-in, so this is the only place its intersection
        # rules run. Any key list works; the test asserts the relationship.
        env:
          DELTA_UPDATE_PINNED_PUBLIC_KEYS: RWQpinned1,RWQpinned2
        run: >-
          cargo test -p tauri-plugin-delta-update --features pinned-keys
          --test pinned_keys_contract --test runtime_trust

  msrv:
    name: msrv (1.90)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      # A dependency bump can silently raise the supported toolchain while
      # stable CI stays green. Only the shipped crates are checked: dev-only
      # dependencies are allowed to need a newer compiler.
      - run: >-
          cargo +1.90.0 check
          -p delta-update-engine
          -p tauri-plugin-delta-update
          -p delta-update-cli

  coverage:
    name: coverage (engine)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Report-only for now: the threshold is deferred until a baseline exists,
      # but the artifact makes line/branch drift visible per pull request.
      - run: cargo llvm-cov -p delta-update-engine --lib --lcov --output-path engine-lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: engine-coverage
          path: engine-lcov.info

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run end-to-end scenarios
        run: cargo run -p delta-update-e2e

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
