name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，必须与 workspace.package.version 一致（例如 1.0.0-rc.3）"
        required: true
        type: string
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: version matches workspace
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $requested = $env:REQUESTED_VERSION
          if ($requested.StartsWith("v")) { $requested = $requested.Substring(1) }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq "delta-update-engine" } | Select-Object -First 1).version
          if ($version -ne $requested) {
            throw "requested version $requested does not match workspace version $version"
          }
      - run: cargo xtask ci
      - run: cargo xtask docs-check
      - run: cargo xtask version-sync
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish:
    needs: verify
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          wait_for_crate() {
            crate="$1"
            version="$2"
            url="https://crates.io/api/v1/crates/$crate/$version"
            for attempt in $(seq 1 30); do
              # The version endpoint is a stable contract and includes
              # prereleases; `cargo info` output is not a stable API.
              if curl -fsS -H "User-Agent: delta-update-release-ci" "$url" >/dev/null; then
                echo "$crate $version is visible on crates.io"
                return 0
              fi
              echo "waiting for $crate $version (attempt $attempt)"
              sleep 10
            done
            echo "timed out waiting for $crate $version" >&2
            return 1
          }
          cargo publish -p delta-update-engine --locked
          wait_for_crate delta-update-engine "$version"
          cargo publish -p tauri-plugin-delta-update --locked
          wait_for_crate tauri-plugin-delta-update "$version"
          cargo publish -p delta-update-cli --locked
      - name: publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          $version = (Get-Content packages/plugin-api/package.json -Raw | ConvertFrom-Json).version
          $tag = if ($version -match '-') { 'next' } else { 'latest' }
          pnpm --filter tauri-plugin-delta-update-api publish --access public --no-git-checks --tag $tag
