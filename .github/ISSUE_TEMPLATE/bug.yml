name: Bug report
description: 报告更新失败、回滚异常或签名问题
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 现象、错误码、状态快照；请先脱敏
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 插件版本与应用版本
    validations:
      required: true
  - type: dropdown
    id: install-form
    attributes:
      label: 安装形态
      description: 诊断包里的 `form=` 或安装目录位置
      options:
        - per-user（%LocalAppData%\Programs）
        - per-machine（%ProgramFiles%，需要提权）
        - portable（任意可写目录）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 诊断信息
      description: staging/journal 文件名列表、delta-update 日志、status 返回值
