[workspace]

[package]
name = "delta-test-demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "demo-app"
path = "src/main.rs"

[dependencies]
delta-update-engine = { path = "../../crates/delta-update-engine" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
url = "2"
