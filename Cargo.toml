[workspace]
resolver = "2"
members = ["crates/*", "e2e", "xtask", "real-test/demo-app"]
exclude = ["examples/minimal-tauri-app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["delta-update-engine contributors"]

[workspace.dependencies]
# serialization / errors
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# async / http
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "blocking", "json"] }
futures-util = "0.3"
url = "2"

# crypto / signing
minisign-verify = "0.2"
sha2 = "0.10"
hex = "0.4"

# diff / compression
qbsdiff = "1"
zstd = "0.13"

# utilities
semver = "1"
uuid = { version = "1", features = ["v4"] }
fs4 = "1.1"
walkdir = "2"
tempfile = "3"
dunce = "1"
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# plugin
tauri = { version = "2" }
tauri-plugin = "2"

# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
indicatif = "0.18"
minisign = "0.7"
hmac = "0.12"
sha1 = "0.10"
chrono = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
