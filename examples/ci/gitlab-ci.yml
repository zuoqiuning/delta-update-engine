# Copy into .gitlab-ci.yml. Assumes a Windows runner with PowerShell.
#
# The pipeline needs the previous release's build output as --from. Fetch it
# from the previous tag's artifact before this job runs.
#
# Optional multi-baseline: fetch older build artifacts into build/<version> and
# add `--baseline "<version>=build/<version>"` for each. Keep the count small:
# every baseline adds one manifest entry per file.
#
# Canary flow: release with --channel canary, then after verification run
# `delta-update promote --version $version --channel stable --verify` instead
# of building and patching the release again.
stages:
  - release

delta-update:
  stage: release
  tags: [windows]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - Set-Content -Path release.key -Value $env:MINISIGN_SECRET_KEY -NoNewline
    - $version = $env:CI_COMMIT_TAG.TrimStart('v')
    - $previous = Get-Content build/previous-version
    - >-
      delta-update release
      --from build/previous
      --to target/release
      --version $version
      --from-version $previous
      --bucket "cos://$env:COS_BUCKET"
      --key release.key
      --pipeline --report release-report.json
      # Multi-baseline example (fetch the artifacts first):
      #   --baseline "1.9.0=build/1.9.0"
      #   --baseline "1.8.0=build/1.8.0"
  artifacts:
    when: always
    paths:
      - release-report.json

# Exit codes: 1 = retry the job, 2 = needs a human, 3 = report a bug.
# See docs/cli-contract.md.
