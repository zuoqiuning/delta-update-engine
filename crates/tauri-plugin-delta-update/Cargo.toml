[package]
name = "tauri-plugin-delta-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri 2 plugin for file-level delta updates"
readme = "README.md"
keywords = ["tauri", "updater", "delta", "plugin", "update"]
categories = ["gui", "development-tools"]
documentation = "https://docs.rs/tauri-plugin-delta-update"
links = "tauri-plugin-delta-update"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
tauri.workspace = true
delta-update-engine = { path = "../delta-update-engine", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Registry",
] }

[dev-dependencies]
tempfile.workspace = true
tauri = { workspace = true, features = ["test"] }
delta-update-testkit = { path = "../delta-update-testkit" }
