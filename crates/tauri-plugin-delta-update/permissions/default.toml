[default]
description = "Legacy compatibility set with every command, including confirm_healthy. New deployments should use `manage` (no health confirmation) or `monitor` (read-only)."
permissions = [
    "allow-check",
    "allow-prepare",
    "allow-cancel-prepare",
    "allow-status",
    "allow-confirm-healthy",
    "allow-restart-to-apply",
    "allow-export-diagnostics",
    "allow-open-diagnostics-folder",
    "allow-get-update-history",
    "allow-clear-skipped-version",
    "allow-skip-version",
]
