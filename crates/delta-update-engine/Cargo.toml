[package]
name = "delta-update-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows-only file-level delta update engine for Tauri applications"
readme = "README.md"
keywords = ["tauri", "updater", "delta", "update", "zstd"]
categories = ["development-tools", "filesystem", "os::windows-apis"]
documentation = "https://docs.rs/delta-update-engine"

[lib]
# Every benchmark is a criterion `harness = false` target. Without this the lib
# unittests also run under `cargo bench` and reject criterion's CLI flags
# (`--save-baseline`, `--baseline`) with "Unrecognized option".
bench = false

[features]
default = []
# Enables `fault::crash_point` so tests can abort a worker at a named stage.
# Enabled by delta-update-testkit; never by the plugin or CLI.
fault-injection = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
reqwest.workspace = true
futures-util.workspace = true
url.workspace = true
minisign-verify.workspace = true
sha2.workspace = true
hex.workspace = true
semver.workspace = true
uuid.workspace = true
fs4.workspace = true
walkdir.workspace = true
tempfile.workspace = true
dunce.workspace = true
tracing.workspace = true
time.workspace = true
sysinfo.workspace = true
qbsdiff.workspace = true
zstd.workspace = true
rayon.workspace = true

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
delta-update-testkit = { path = "../delta-update-testkit" }

[[bench]]
name = "hash_tree"
harness = false

[[bench]]
name = "patch_header"
harness = false

[[bench]]
name = "journal_verify"
harness = false

[[bench]]
name = "scan_tree"
harness = false
