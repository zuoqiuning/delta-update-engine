[package]
name = "delta-update-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Build-side release CLI for delta-update-engine (Windows targets)"
readme = "README.md"
keywords = ["tauri", "updater", "delta", "release", "cli"]
categories = ["command-line-utilities", "development-tools", "development-tools::build-utils", "os::windows-apis"]
documentation = "https://docs.rs/delta-update-cli"

[[bin]]
name = "delta-update"
path = "src/main.rs"

[dependencies]
delta-update-engine = { path = "../delta-update-engine", version = "1.0.0-rc.4" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
rayon.workspace = true
reqwest.workspace = true
url.workspace = true
qbsdiff.workspace = true
zstd.workspace = true
hex.workspace = true
semver.workspace = true
sysinfo.workspace = true
minisign.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
chrono.workspace = true
fs4.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
